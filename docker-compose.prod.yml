# Production overlay for a real deployment - TLS (Phase 6a) and a second backend instance behind an
# nginx upstream block (Phase 6b). Adds nothing by itself - combine with docker-compose.yml:
#   ./nginx/init-letsencrypt.sh                                   # one-time: issues the certificate
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires DOMAIN and CERTBOT_EMAIL in .env, and DOMAIN's DNS A record already pointing at this server
# (Let's Encrypt validates ownership over plain HTTP on port 80, so it must be reachable from the internet).
services:
  frontend:
    ports:
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend2: { condition: service_healthy }

  # A second instance of the same backend image, load-balanced with `backend` by nginx's upstream
  # block above. Both read JWT_SECRET from the same .env, which matters here: auth is stateless JWT
  # with no server-side session, so a token issued by one instance must validate on the other, or
  # a request round-robined to the second instance would wrongly look unauthenticated.
  backend2:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sales_tracker}
      MYSQL_USER: ${MYSQL_USER:-tracker}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Re-checks twice a day; certbot itself no-ops unless the cert is within 30 days of expiry.
    # Renewing only replaces the files on disk - nginx keeps the old cert loaded until reloaded, so
    # reload it after a renewal actually happens (see README: "Production TLS").
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'
