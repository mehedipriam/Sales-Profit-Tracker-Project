spring:
  application:
    name: sales-tracker
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 6MB      # order screenshots for the agent
      max-request-size: 7MB
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never JPA
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 480
    remember-me-days: 30   # "Remember me" on the login page
  gemini:
    api-key: ${GEMINI_API_KEY:}   # Google AI Studio key for the order agent; empty turns the agent off
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: https://generativelanguage.googleapis.com
  agent:
    max-requests-per-minute: ${AGENT_MAX_REQUESTS_PER_MINUTE:20}   # AI calls per user per minute (draft, screenshot, change)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health
