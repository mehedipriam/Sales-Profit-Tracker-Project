spring:
  application:
    name: sales-tracker
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never JPA
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 480
    remember-me-days: 30   # "Remember me" on the login page
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health
