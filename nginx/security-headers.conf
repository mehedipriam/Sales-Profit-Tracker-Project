# Standard security headers (Phase 6c). Static (no __DOMAIN__ placeholder), included verbatim into every
# location of the HTTPS server block in prod.conf.template.
#
# nginx only inherits add_header from a parent context when the current location defines NONE of its own
# (a location that sets even one add_header silently drops every inherited one) - so this is `include`d
# inside each location rather than declared once at the server level, to avoid that trap.
#
# CSP is 'self'-only throughout: the build has no CDNs, no inline <script>/<style>, and the frontend calls
# the API via a same-origin relative path (frontend/src/api/client.js: baseURL: '/api') - confirmed by
# reading the actual Vite build output, not assumed. style-src also allows 'unsafe-inline': React (and
# Recharts, used on the Reports page) set inline styles via the CSSOM, which most browsers don't gate on
# style-src anyway, but some SVG styling in chart libraries writes a literal style="" attribute, which does
# need it - the realistic residual risk from that is low (inline CSS, not script), so it's not worth the
# chance of silently breaking the Reports charts to chase a stricter policy here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
