# Serves the built React app and forwards /api to the backend container, so the browser sees one origin
# (no CORS, and the frontend's relative /api calls work unchanged). Phase 6 hardens this into the public reverse proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints everything in /assets, so it can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/orders, /reports ...) must fall back to index.html; never cache it so a deploy shows up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
